        function LoginScreen({ onUnlockWithCode }) {
            const [mode, setMode] = useState("login"); // 'login' | 'setup'
            const [accessCode, setAccessCode] = useState("");
            const [confirmCode, setConfirmCode] = useState("");
            const [showCode, setShowCode] = useState(false);
            const [loading, setLoading] = useState(false);
            const [errorMsg, setErrorMsg] = useState("");

            const handleCodeSubmit = async (e) => {
                e.preventDefault();
                setErrorMsg("");
                const cleanCode = accessCode.trim().toLowerCase();

                if (!cleanCode) {
                    setErrorMsg("請輸入通行密碼");
                    return;
                }

                if (cleanCode.length < 4) {
                    setErrorMsg("通行密碼請至少設定 4 個字元或數字");
                    return;
                }

                if (mode === "setup" && accessCode !== confirmCode) {
                    setErrorMsg("兩次輸入的密碼不一致，請重新確認");
                    return;
                }

                setLoading(true);
                try {
                    await onUnlockWithCode(cleanCode, mode === "setup");
                } catch (err) {
                    console.error("Passcode auth error:", err);
                    setErrorMsg(err.message || "驗證失敗，請稍後再試");
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen bg-[#F8F9FA] flex items-center justify-center p-4">
                    <div className="max-w-md w-full bg-white rounded-3xl border border-slate-200/80 p-8 shadow-float space-y-6">
                        <div className="text-center space-y-2">
                            <div className="w-16 h-16 bg-steel-blue text-white rounded-2xl flex items-center justify-center text-3xl font-extrabold mx-auto shadow-md">
                                🔑
                            </div>
                            <h2 className="text-2xl font-black text-slate-800 tracking-tight">
                                {mode === "setup" ? "自訂全新通行密碼" : "輸入通行密碼解鎖"}
                            </h2>
                            <p className="text-xs text-slate-500 font-medium">
                                {mode === "setup" 
                                    ? "請設定一組 4 位數以上的專屬密碼，隨時跨裝置同步你的旅遊行程" 
                                    : "請輸入你自訂的個人或團體專屬通行密碼"}
                            </p>
                        </div>

                        {errorMsg && (
                            <div className="p-3 bg-red-50 border border-red-200 rounded-xl text-xs font-semibold text-red-600 text-center animate-fade-in">
                                ⚠️ {errorMsg}
                            </div>
                        )}

                        <form onSubmit={handleCodeSubmit} className="space-y-4">
                            <div>
                                <div className="flex items-center justify-between mb-1">
                                    <label className="block text-xs font-bold text-slate-600">
                                        {mode === "setup" ? "設定通行密碼 (如: 8888 或 JAPAN2026)" : "通行密碼"}
                                    </label>
                                    <button 
                                        type="button" 
                                        onClick={() => setShowCode(!showCode)}
                                        className="text-[11px] font-bold text-steel-blue hover:underline"
                                    >
                                        {showCode ? "隱藏" : "顯示密碼"}
                                    </button>
                                </div>
                                <input 
                                    type={showCode ? "text" : "password"} 
                                    value={accessCode}
                                    onChange={(e) => setAccessCode(e.target.value)}
                                    placeholder="例如：8888 或 TOKYO2026"
                                    className="w-full px-4 py-3 border border-slate-200 rounded-xl text-center text-base font-extrabold tracking-widest text-slate-800 focus:outline-none focus:border-steel-blue bg-slate-50"
                                    required
                                    autoFocus
                                />
                            </div>

                            {mode === "setup" && (
                                <div>
                                    <label className="block text-xs font-bold text-slate-600 mb-1">再次確認通行密碼</label>
                                    <input 
                                        type={showCode ? "text" : "password"} 
                                        value={confirmCode}
                                        onChange={(e) => setConfirmCode(e.target.value)}
                                        placeholder="請再次輸入相同的密碼"
                                        className="w-full px-4 py-3 border border-slate-200 rounded-xl text-center text-base font-extrabold tracking-widest text-slate-800 focus:outline-none focus:border-steel-blue bg-slate-50"

                                    />
                                </div>
                            )}

                                            }}
                                            className="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-lg text-xs"
                                        >
                                            ⚡ {preset}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <button
                                type="submit"
                                disabled={loading}
                                className="w-full bg-steel-blue hover:bg-steel-blue-dark text-white font-extrabold text-xs py-3.5 rounded-xl shadow-xs transition-all flex items-center justify-center gap-2"

                        </div>
                    </div>

        const getGoogleMapsSearchUrl = (actOrLocation) => {
            if (!actOrLocation) return "#";
            
            // If passed a direct string URL or activity object with mapUrl
            if (typeof actOrLocation === 'object' && actOrLocation.mapUrl && (actOrLocation.mapUrl.startsWith('http://') || actOrLocation.mapUrl.startsWith('https://'))) {
                return actOrLocation.mapUrl;
            }

            const queryTerm = typeof actOrLocation === 'string' 
                ? actOrLocation 
                : (actOrLocation.address || actOrLocation.location || "");

            if (!queryTerm) return "#";
            const fullQuery = queryTerm.includes("日本") ? queryTerm : `${queryTerm} 日本`;
            return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(fullQuery)}`;
        };

        const getGoogleMapsMultiStopRouteUrl = (activities) => {
            if (!activities || activities.length === 0) return "#";
            
            // Collect valid address or location strings in chronological itinerary order
            const validLocs = activities
                .map(a => a?.address || a?.location)
                .filter(Boolean)
                .map(loc => loc.includes("日本") ? loc : `${loc} 日本`);

            if (validLocs.length === 0) return "#";
            if (validLocs.length === 1) return getGoogleMapsSearchUrl(validLocs[0]);

            const origin = encodeURIComponent(validLocs[0]);
            const destination = encodeURIComponent(validLocs[validLocs.length - 1]);
            
            if (validLocs.length === 2) {
                return `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}&travelmode=transit`;
            }

            const waypoints = validLocs.slice(1, -1).map(loc => encodeURIComponent(loc)).join('|');
            return `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}&waypoints=${waypoints}&travelmode=transit`;
        };

        const resolveCoords = (locationName, index = 0) => {
            for (let key in JAPAN_LOCATIONS_COORDS) {
                if (locationName.includes(key) || key.includes(locationName)) {
                    return JAPAN_LOCATIONS_COORDS[key];
                }
            }
            if (locationName.includes("京都") || locationName.includes("清水") || locationName.includes("HARUKA")) {
                return [34.9858 + (index * 0.005), 135.7588 + (index * 0.005)];
            }
            return [35.6804 + (index * 0.008), 139.7690 + (index * 0.008)];
        };

        function MapPlannerView({ activities = [], dayTitle }) {
            const mapContainerRef = useRef(null);
            const leafletMapRef = useRef(null);

            useEffect(() => {
                if (!mapContainerRef.current || !window.L) return;

                if (leafletMapRef.current) {
                    leafletMapRef.current.remove();
                    leafletMapRef.current = null;
                }

                const safeActivities = activities || [];
                if (safeActivities.length === 0) return;

                const points = safeActivities.map((act, idx) => {
                    const coords = resolveCoords(act?.location || "", idx);
                    return { ...act, coords, sequence: idx + 1 };
                });

                const centerCoords = points[0]?.coords || [35.6804, 139.7690];
                const map = window.L.map(mapContainerRef.current).setView(centerCoords, 13);
                leafletMapRef.current = map;

                window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '&copy; OpenStreetMap'
                }).addTo(map);

                const latLngs = [];

                points.forEach((pt) => {
                    latLngs.push(pt.coords);
                    const typeInfo = ACTIVITY_TYPES[pt.type] || ACTIVITY_TYPES.Sightseeing;

                    const customIcon = window.L.divIcon({
                        className: 'custom-map-pin',
                        html: `
                            <div style="
                                background-color: ${typeInfo.pinColor};
                                color: white;
                                width: 32px;
                                height: 32px;
                                border-radius: 50%;
                                display: flex;
                                align-items: center;
                                justify-content: center;
                                font-weight: bold;
                                font-size: 13px;
                                border: 2px solid white;
                                box-shadow: 0 4px 10px rgba(0,0,0,0.25);
                            ">
                                ${pt.sequence}
                            </div>
                        `,
                        iconSize: [32, 32],
                        iconAnchor: [16, 16]
                    });

                    const popupContent = `
                        <div style="font-family: sans-serif; padding: 4px; min-width: 180px;">
                            <div style="font-size: 11px; font-weight: bold; color: ${typeInfo.pinColor}; margin-bottom: 2px;">
                                ${typeInfo.tag} • ${pt.time}
                            </div>
                            <div style="font-size: 14px; font-weight: bold; color: #1e293b; margin-bottom: 2px;">
                                ${pt.location}
                            </div>
                            ${pt.address ? `<div style="font-size: 11px; color: #475569; margin-bottom: 4px;">📍 ${pt.address}</div>` : ''}
                            ${pt.notes ? `<div style="font-size: 11px; color: #64748b; margin-bottom: 6px;">💡 ${pt.notes}</div>` : ''}
                            <a href="${getGoogleMapsSearchUrl(pt)}" target="_blank" rel="noopener noreferrer" style="
                                display: inline-flex;
                                items-center;
                                gap: 4px;
                                font-size: 12px;
                                font-weight: 600;
                                color: white;
                                background-color: #46B2B4;
                                padding: 6px 10px;
                                border-radius: 8px;
                                text-decoration: none;
                                margin-top: 4px;
                            ">
                                在 Google Maps 開啟 ↗
                            </a>
                        </div>
                    `;

                    window.L.marker(pt.coords, { icon: customIcon })
                        .addTo(map)
                        .bindPopup(popupContent);
                });

                if (latLngs.length > 1) {
                    window.L.polyline(latLngs, {
                        color: '#46B2B4',
                        weight: 4,
                        opacity: 0.8,
                        dashArray: '8, 8'
                    }).addTo(map);

                    const bounds = window.L.latLngBounds(latLngs);
                    map.fitBounds(bounds, { padding: [50, 50] });
                }

                setTimeout(() => {
                    map.invalidateSize();
                }, 300);

            }, [activities]);

            return (
                <div className="bg-white rounded-2xl border border-slate-200/80 p-4 shadow-card space-y-3">
                    <div className="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 pb-3">
                        <div className="flex items-center gap-2">
                            <span className="w-3 h-3 rounded-full bg-steel-blue animate-pulse"></span>
                            <h4 className="font-bold text-slate-800 text-sm">{dayTitle} - 地理位置地圖導覽</h4>
                        </div>

                        <a

                            target="_blank"
                            rel="noopener noreferrer"
                            className="bg-steel-blue hover:bg-steel-blue-dark text-white text-xs font-semibold px-3 py-1.5 rounded-xl transition-all shadow-xs flex items-center gap-1.5"
                        >
                            <i data-lucide="map" className="w-3.5 h-3.5"></i>
                            <span>開啟 Google Maps 一日整條導航路線</span>
                        </a>

                    {(!activities || activities.length === 0) ? (

        function TripDetailView({ trip, onUpdateItinerary, showToast }) {
            const [selectedDayIndex, setSelectedDayIndex] = useState(0);
            const [isAddActivityOpen, setIsAddActivityOpen] = useState(false);
            const [editingActivity, setEditingActivity] = useState(null);
            const [viewMode, setViewMode] = useState("timeline"); // 'timeline' | 'map' | 'split'
            
            const [travelTimeModalAct, setTravelTimeModalAct] = useState(null);
            const [travelTimeInput, setTravelTimeInput] = useState("");

            const itinerary = trip?.dailyItinerary || [];
            if (!trip || itinerary.length === 0) {
                return (
                    <div className="bg-white rounded-2xl p-8 text-center text-slate-500 border border-slate-200">
                        目前尚無行程天數數據。
                    </div>
                );
            }

            const currentDayObj = itinerary[selectedDayIndex] || itinerary[0] || { activities: [] };
            const currentActivities = currentDayObj?.activities || [];

            const handleSaveActivity = (activityData) => {
                const updated = [...itinerary];
                const dayActivities = [...(updated[selectedDayIndex]?.activities || [])];

                if (editingActivity) {
                    const idx = dayActivities.findIndex(a => a?.id === editingActivity.id);
                    if (idx !== -1) {
                        dayActivities[idx] = { ...editingActivity, ...activityData };
                    }
                } else {
                    const newAct = {
                        id: "act-" + Date.now(),
                        ...activityData
                    };
                    dayActivities.push(newAct);
                }

                dayActivities.sort((a, b) => (a?.time || "").localeCompare(b?.time || ""));

                updated[selectedDayIndex] = {
                    ...updated[selectedDayIndex],
                    activities: dayActivities
                };

                onUpdateItinerary(updated);
                setIsAddActivityOpen(false);
                setEditingActivity(null);
                showToast(editingActivity ? "已更新活動內容！" : "🎉 已成功新增行程活動！");
            };

            const handleSaveTravelTime = (e) => {
                e.preventDefault();
                if (!travelTimeModalAct) return;

                const updated = [...itinerary];
                const dayActivities = [...(updated[selectedDayIndex]?.activities || [])];
                const idx = dayActivities.findIndex(a => a?.id === travelTimeModalAct.id);

                if (idx !== -1) {
                    dayActivities[idx] = { ...dayActivities[idx], travelTime: travelTimeInput.trim() };
                    updated[selectedDayIndex] = {
                        ...updated[selectedDayIndex],
                        activities: dayActivities
                    };
                    onUpdateItinerary(updated);
                    showToast("⏱️ 已更新交通時間估算！");
                }

                setTravelTimeModalAct(null);
                setTravelTimeInput("");

                const updated = [...itinerary];
                updated[selectedDayIndex] = {
                    ...updated[selectedDayIndex],
                    activities: (updated[selectedDayIndex]?.activities || []).filter(a => a?.id !== actId)
                };
                onUpdateItinerary(updated);
                showToast("已刪除活動");

            const handleMoveActivity = (index, direction) => {
                const updated = [...itinerary];
                const activities = [...(updated[selectedDayIndex]?.activities || [])];
                const targetIndex = index + direction;

                if (targetIndex < 0 || targetIndex >= activities.length) return;

                const temp = activities[index];
                activities[index] = activities[targetIndex];

                updated[selectedDayIndex] = {
                    ...updated[selectedDayIndex],
                    activities

        function BudgetView({ trip, onUpdateBudget }) {
            const [isEditingBudget, setIsEditingBudget] = useState(false);
            const [budgetValue, setBudgetValue] = useState(trip?.budget?.total || 200000);

            const totalActivitiesCost = useMemo(() => {
                const itinerary = trip?.dailyItinerary || [];
                return itinerary.reduce((sum, d) => {
                    return sum + (d?.activities || []).reduce((s, a) => s + (Number(a?.cost) || 0), 0);
                }, 0);
            }, [trip]);

            const totalGroupExpenseCostJPY = useMemo(() => {
                const expenses = trip?.groupExpenses || [];
                return expenses.reduce((sum, ge) => sum + (Number(ge?.amountJPY) || 0), 0);
            }, [trip]);

            const totalSpent = totalActivitiesCost + totalGroupExpenseCostJPY;
            const totalBudget = trip?.budget?.total || 200000;
            const isOverBudget = totalSpent > totalBudget;
            const remaining = totalBudget - totalSpent;

            const categoryBreakdown = useMemo(() => {
                const map = { Food: 0, Sightseeing: 0, Transport: 0, Hotel: 0, Shopping: 0 };
                const itinerary = trip?.dailyItinerary || [];
                itinerary.forEach(d => {
                    (d?.activities || []).forEach(a => {
                        if (a?.type && map[a.type] !== undefined) {
                            map[a.type] += (Number(a.cost) || 0);
                        }
                    });
                });
                return map;
            }, [trip]);

            const handleSaveBudget = (e) => {
                e.preventDefault();
                onUpdateBudget(Number(budgetValue) || 0);
                setIsEditingBudget(false);
            };

            return (
                <div className="space-y-6">
                    <div className="bg-white rounded-2xl border border-slate-200/80 p-5 shadow-card flex flex-wrap items-center justify-between gap-4">
                        <div>
                            <h3 className="font-extrabold text-slate-800 text-lg flex items-center gap-2">

                                <span>預算與花費追蹤 (JPY 日圓)</span>
                            </h3>
                            <p className="text-xs text-slate-500 mt-1">即時統計每日行程與共同分帳開銷，避免旅遊預算超支！</p>
                        </div>

                        <button 
                            onClick={() => {
                                setBudgetValue(totalBudget);
                                setIsEditingBudget(true);
                            }}
                            className="bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold px-3.5 py-2 rounded-xl transition-all border border-slate-200 flex items-center gap-1.5"
                        >
                            <i data-lucide="edit-3" className="w-3.5 h-3.5"></i>
                            <span>修改總預算上限</span>
                        </button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div className="bg-white rounded-2xl border border-slate-200/80 p-5 shadow-card space-y-1">
                            <span className="text-xs font-bold text-slate-400">旅行總預算上限</span>
                            <p className="text-2xl font-black text-slate-800">¥{totalBudget.toLocaleString()} <span className="text-xs font-semibold text-slate-400">JPY</span></p>
                        </div>

                        <div className="bg-white rounded-2xl border border-slate-200/80 p-5 shadow-card space-y-1">
                            <span className="text-xs font-bold text-slate-400">目前預估總支出</span>
                            <p className={`text-2xl font-black ${isOverBudget ? 'text-red-600' : 'text-steel-blue-dark'}`}>
                                ¥{totalSpent.toLocaleString()} <span className="text-xs font-semibold text-slate-400">JPY</span>
                            </p>
                        </div>

                        <div className="bg-white rounded-2xl border border-slate-200/80 p-5 shadow-card space-y-1">
                            <span className="text-xs font-bold text-slate-400">剩餘預算可花費</span>
                            <p className={`text-2xl font-black ${remaining < 0 ? 'text-red-600' : 'text-emerald-600'}`}>
                                ¥{remaining.toLocaleString()} <span className="text-xs font-semibold text-slate-400">JPY</span>
                            </p>
                        </div>
                    </div>

                    {isOverBudget && (
                        <div className="bg-red-50 border border-red-200 text-red-700 p-4 rounded-2xl text-xs font-bold flex items-center gap-3">
                            <i data-lucide="alert-triangle" className="w-5 h-5 shrink-0 text-red-600"></i>
                            <span>警告：目前預估總花費已超出原定預算上限 ¥{Math.abs(remaining).toLocaleString()} 日圓！請調整行程或提高預算。</span>
                        </div>
                    )}

                    <div className="bg-white rounded-2xl border border-slate-200/80 p-6 shadow-card space-y-4">
                        <h4 className="font-bold text-slate-800 text-base">分類支出佔比統計</h4>
                        <div className="space-y-3">
                            {Object.entries(ACTIVITY_TYPES).map(([typeKey, info]) => {
                                const cost = categoryBreakdown[typeKey] || 0;
                                const pct = totalSpent > 0 ? Math.round((cost / totalSpent) * 100) : 0;

                                return (
                                    <div key={typeKey} className="space-y-1.5">
                                        <div className="flex items-center justify-between text-xs font-bold">
                                            <span className="flex items-center gap-1.5 text-slate-700">
                                                <span>{info.tag}</span>
                                                <span>{info.label}</span>
                                            </span>
                                            <span className="text-slate-800">
                                                ¥{cost.toLocaleString()} ({pct}%)

                                        <div className="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden">
                                            <div 
                                                className={`h-full ${info.color} transition-all duration-500`} 
                                                style={{ width: `${pct}%` }}
                                            ></div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    {isEditingBudget && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm p-4">
                            <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-float border border-slate-100 space-y-4">

                                        <span>修改旅行預算上限</span>
                                    </h3>
                                    <button onClick={() => setIsEditingBudget(false)} className="p-1 text-slate-400 hover:text-slate-600">
                                        <i data-lucide="x" className="w-5 h-5"></i>
                                    </button>
                                </div>

                                <form onSubmit={handleSaveBudget} className="space-y-4">

        function GroupExpensesView({ trip, onUpdateGroupExpenses, onUpdateMembers, showToast }) {
            const [isAddExpenseOpen, setIsAddExpenseOpen] = useState(false);
            const [newMemberName, setNewMemberName] = useState("");

            const groupExpenses = trip?.groupExpenses || [];
            const members = trip?.members || ["我", "小明", "阿華"];

            const handleAddExpense = (expenseData) => {
                const updated = [
                    ...(groupExpenses || []),
                    { id: "ge-" + Date.now(), ...expenseData }
                ];
                onUpdateGroupExpenses(updated);
                setIsAddExpenseOpen(false);
                showToast("🎉 已成功登記團體分帳費用！");
            };

            const handleDeleteExpense = (id) => {
                onUpdateGroupExpenses((groupExpenses || []).filter(e => e?.id !== id));
                showToast("已刪除分帳項目");
            };

            const handleAddMember = (e) => {
                e.preventDefault();
                if (!newMemberName.trim()) return;
                if (members.includes(newMemberName.trim())) {
                    showToast("成員已存在");
                    return;
                }
                const updated = [...members, newMemberName.trim()];
                onUpdateMembers(updated);
                setNewMemberName("");
                showToast(`已新增成員：${newMemberName.trim()}`);
            };

            const settlementData = useMemo(() => {
                const balances = {};
                (members || []).forEach(m => { balances[m] = 0; });

                (groupExpenses || []).forEach(exp => {
                    if (!exp) return;
                    const payer = exp.paidBy;
                    const splitList = exp.splitAmong || [];
                    const splitCount = splitList.length || 1;
                    const amountHKD = exp.amountHKD || 0;

                    if (balances[payer] !== undefined) {
                        balances[payer] += amountHKD;
                    }

                    const sharePerPerson = amountHKD / splitCount;
                    splitList.forEach(m => {
                        if (balances[m] !== undefined) {
                            balances[m] -= sharePerPerson;
                        }
                    });
                });

                const creditors = [];
                const debtors = [];

                Object.entries(balances).forEach(([person, bal]) => {
                    if (bal > 0.01) creditors.push({ person, amount: bal });
                    else if (bal < -0.01) debtors.push({ person, amount: -bal });
                });

                const settlements = [];
                let i = 0, j = 0;

                while (i < debtors.length && j < creditors.length) {
                    const payAmount = Math.min(debtors[i].amount, creditors[j].amount);
                    settlements.push({
                        from: debtors[i].person,
                        to: creditors[j].person,
                        amountHKD: Math.round(payAmount),
                        amountJPY: Math.round(payAmount / 0.052)
                    });

                    debtors[i].amount -= payAmount;
                    creditors[j].amount -= payAmount;

                    if (debtors[i].amount < 0.01) i++;
                    if (creditors[j].amount < 0.01) j++;
                }

                return { balances, settlements };
            }, [groupExpenses, members]);

                        <button

                    <div className="bg-white rounded-2xl border border-slate-200/80 p-5 shadow-card space-y-3">

                        <div className="flex flex-wrap items-center gap-2">

                            <form onSubmit={handleAddMember} className="flex items-center gap-1">

                            </form>
                        </div>
                    </div>

                    <div className="bg-gradient-to-br from-slate-900 to-slate-800 text-white rounded-3xl p-6 shadow-float space-y-4">
                        <div className="flex items-center justify-between border-b border-slate-700 pb-3">

                            </h4>
                            <span className="text-[10px] text-slate-400 bg-slate-800 px-2.5 py-1 rounded-full border border-slate-700">自動平帳匯率：1 JPY ≈ 0.052 HKD</span>
                        </div>

                        {settlementData.settlements.length === 0 ? (
                            <p className="text-xs text-slate-400 py-2">🎉 目前大家都已結清，沒有人需要補交任何費用！</p>
                        ) : (
                            <div className="space-y-2.5">
                                {settlementData.settlements.map((st, idx) => (
                                    <div key={idx} className="bg-white/10 backdrop-blur-md rounded-2xl p-3.5 border border-white/10 flex items-center justify-between gap-3 text-xs">
                                        <div className="flex items-center gap-2">

                                        <div className="text-right">

                                            <span className="text-[10px] text-slate-400 block">(約 ¥{st.amountJPY.toLocaleString()} JPY)</span>
                                        </div>

                    <div className="bg-white rounded-2xl border border-slate-200/80 p-5 shadow-card space-y-4">

                                            <p className="text-xs text-slate-500">

                                        type="number"
                                        value={jpyInput}
                                        onChange={(e) => setJpyInput(e.target.value)}
                                        className="w-full pl-8 pr-3 py-2 bg-white border border-slate-200 rounded-xl font-black text-slate-800 text-base focus:outline-none focus:border-steel-blue"
                                    />
                                </div>
                            </div>

                            <div className="flex justify-center">
                                <div className="w-8 h-8 rounded-full bg-steel-blue text-white flex items-center justify-center shadow-sm">
                                    <i data-lucide="arrow-down-up" className="w-4 h-4"></i>
                                </div>
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-slate-600 mb-1">折算港幣 (HKD)</label>
                                <div className="relative">
                                    <span className="absolute left-3 top-2.5 font-bold text-emerald-600 text-sm">HK$</span>
                                    <input 
                                        type="text"
                                        value={hkdAmount}
                                        readOnly
                                        className="w-full pl-12 pr-3 py-2 bg-emerald-50 border border-emerald-200 rounded-xl font-black text-emerald-700 text-base focus:outline-none"
                                    />
                                </div>
                            </div>
                        </div>

                        <div className="space-y-2">
                            <span className="text-xs font-bold text-slate-500">常用金額快速快捷鍵：</span>
                            <div className="grid grid-cols-2 gap-2 text-xs font-bold">
                                {[1000, 5000, 10000, 50000].map(val => (
                                    <button
                                        key={val}
                                        type="button"
                                        onClick={() => setJpyInput(val.toString())}
                                        className="p-2 bg-slate-50 border border-slate-200 rounded-xl text-slate-700 hover:bg-steel-blue hover:text-white transition-colors"
                                    >
                                        ¥{val.toLocaleString()} JPY
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const [authenticatedCode, setAuthenticatedCode] = useState(() => {
                return localStorage.getItem("japan_travel_passcode") || "";
            });
            const [authChecking, setAuthChecking] = useState(true);
            const [syncStatus, setSyncStatus] = useState("connecting"); // 'connecting' | 'synced' | 'error'

            const [trips, setTrips] = useState(INITIAL_TRIPS);
            const [selectedTripId, setSelectedTripId] = useState(null);
            const [activeTab, setActiveTab] = useState("dashboard");
            const [toastMessage, setToastMessage] = useState("");

            useEffect(() => {
                const FB = window.FirebaseServices;
                if (!FB || !FB.auth) {
                    setAuthChecking(false);
                    return;
                }

                FB.signInAnonymously(FB.auth)
                    .then(() => setAuthChecking(false))
                    .catch((err) => {
                        console.warn("Firebase Auth Anonymous login is not enabled in Firebase Console. Operating in local passcode mode:", err.message);
                        setAuthChecking(false);
                    });
            }, []);

            useEffect(() => {
                const FB = window.FirebaseServices;
                const localDataKey = `japan_travel_trips_${authenticatedCode}`;
                
                // Immediately attempt loading from local cache for fast offline access
                if (authenticatedCode) {
                    const cachedLocal = localStorage.getItem(localDataKey);
                    if (cachedLocal) {
                        try {
                            const parsed = JSON.parse(cachedLocal);
                            if (Array.isArray(parsed) && parsed.length > 0) {
                                setTrips(parsed);
                                if (!selectedTripId) setSelectedTripId(parsed[0].id);
                            }
                        } catch (e) {
                            console.error("Error reading local storage cache:", e);
                        }
                    }
                }

                if (!authenticatedCode || !FB || !FB.db) {
                    setSyncStatus("synced");
                    return;
                }

                setSyncStatus("connecting");
                const dbRef = FB.ref(FB.db, `workspaces/${authenticatedCode}`);

                // 使用 onValue() 進行 Realtime Database 實時監聽
                const unsubscribe = FB.onValue(dbRef, (snapshot) => {
                    if (snapshot.exists()) {
                        const data = snapshot.val();
                        if (data && Array.isArray(data.trips)) {
                            // 防禦性充填 array 屬性，確保 Firebase 省略的空陣列不會造成 JS undefined 錯誤
                            const normalizedTrips = data.trips.map(t => ({
                                ...t,
                                dailyItinerary: (t?.dailyItinerary || []).map(d => ({
                                    ...d,
                                    activities: d?.activities || []
                                })),
                                bookings: t?.bookings || [],
                                groupExpenses: (t?.groupExpenses || []).map(ge => ({
                                    ...ge,
                                    splitAmong: ge?.splitAmong || []
                                })),
                                members: t?.members || ["我"],
                                toBuyList: t?.toBuyList || []
                            }));
                            setTrips(normalizedTrips);
                            localStorage.setItem(localDataKey, JSON.stringify(normalizedTrips));
                            if (!selectedTripId && normalizedTrips.length > 0) {
                                setSelectedTripId(normalizedTrips[0].id);
                            }
                        }
                    } else {
                        // 節點不存在時，初始化預設行程
                        FB.set(dbRef, { trips: INITIAL_TRIPS, code: authenticatedCode, updatedAt: new Date().toISOString() })
                          .catch(err => console.warn("RTDB write error, falling back to local storage:", err.message));
                    }
                    setSyncStatus("synced");
                }, (error) => {
                    console.warn("RTDB sync unavailable, falling back to local storage:", error.message);
                    setSyncStatus("error");
                });

                return () => unsubscribe();
            }, [authenticatedCode]);

            // Helper to write updated trips directly to Realtime Database and LocalStorage
            const saveTripsToCloud = async (updatedTrips) => {
                setTrips(updatedTrips);
                if (authenticatedCode) {
                    const localDataKey = `japan_travel_trips_${authenticatedCode}`;
                    localStorage.setItem(localDataKey, JSON.stringify(updatedTrips));
                }

                const FB = window.FirebaseServices;
                if (!authenticatedCode || !FB || !FB.db) return;

                try {
                    setSyncStatus("connecting");
                    const dbRef = FB.ref(FB.db, `workspaces/${authenticatedCode}`);
                    await FB.set(dbRef, { trips: updatedTrips, code: authenticatedCode, updatedAt: new Date().toISOString() });
                    setSyncStatus("synced");
                } catch (err) {
                    console.warn("Save to Realtime Database failed, data saved locally:", err.message);
                    setSyncStatus("error");
                }
            };

            const handleUnlockWithCode = async (code, isNewSetup) => {
                const FB = window.FirebaseServices;

                if (FB && FB.db) {
                    try {
                        const dbRef = FB.ref(FB.db, `workspaces/${code}`);
                        const snapshot = await FB.get(dbRef);

                        if (!isNewSetup && !snapshot.exists()) {
                            await FB.set(dbRef, { trips: INITIAL_TRIPS, code, updatedAt: new Date().toISOString() });
                        }
                    } catch (err) {
                        console.warn("Firebase check bypassed on unlock, using local storage:", err.message);
                    }
                }

                localStorage.setItem("japan_travel_passcode", code);
                setAuthenticatedCode(code);
                showToast(`🔑 已驗證通行密碼 [${code.toUpperCase()}]！`);
            };

            const handleLogout = () => {
                localStorage.removeItem("japan_travel_passcode");
                setAuthenticatedCode("");
                showToast("已鎖定 App 密碼頁面");
            };

            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [activeTab, selectedTripId, trips, authenticatedCode]);

            const currentTrip = useMemo(() => {
                return trips.find(t => t.id === selectedTripId) || trips[0];
            }, [trips, selectedTripId]);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(""), 3000);
            };

            const handleUpdateItinerary = (updatedItinerary) => {
                const updated = trips.map(t => t.id === currentTrip.id ? { ...t, dailyItinerary: updatedItinerary } : t);
                saveTripsToCloud(updated);
            };

            const handleUpdateBookings = (updatedBookings) => {
                const updated = trips.map(t => t.id === currentTrip.id ? { ...t, bookings: updatedBookings } : t);
                saveTripsToCloud(updated);
            };

            const handleUpdateBudget = (newTotal) => {
                const updated = trips.map(t => t.id === currentTrip.id ? { ...t, budget: { ...t.budget, total: newTotal } } : t);
                saveTripsToCloud(updated);
                showToast("已修改旅行預算！");
            };

            const handleUpdateToBuyList = (newList) => {
                const updated = trips.map(t => t.id === currentTrip.id ? { ...t, toBuyList: newList } : t);
                saveTripsToCloud(updated);
            };

            const handleUpdateGroupExpenses = (newExpenses) => {
                const updated = trips.map(t => t.id === currentTrip.id ? { ...t, groupExpenses: newExpenses } : t);
                saveTripsToCloud(updated);
            };

            const handleUpdateMembers = (newMembers) => {
                const updated = trips.map(t => t.id === currentTrip.id ? { ...t, members: newMembers } : t);
                saveTripsToCloud(updated);
            };

            const handleCreateTrip = (newTrip) => {
                const updated = [newTrip, ...trips];
                saveTripsToCloud(updated);
                setSelectedTripId(newTrip.id);
                setActiveTab("itinerary");
                showToast("🎉 已成功創建全新旅程！");
            };

            const handleDeleteTrip = (tripId) => {
                const filtered = trips.filter(t => t.id !== tripId);
                saveTripsToCloud(filtered);
                if (selectedTripId === tripId) {
                    setSelectedTripId(filtered[0]?.id || null);
                }
                showToast("已刪除旅程");
            };

            if (authChecking) {
                return (
                    <div className="min-h-screen bg-[#F8F9FA] flex flex-col items-center justify-center space-y-3">
                        <div className="w-10 h-10 border-4 border-steel-blue border-t-transparent rounded-full animate-spin"></div>
                        <p className="text-xs font-bold text-slate-500">初始化密碼驗證系統...</p>
                    </div>
                );
            }

            if (!authenticatedCode) {
                return <LoginScreen onUnlockWithCode={handleUnlockWithCode} />;
            }

            return (
                <div className="min-h-screen flex flex-col md:flex-row bg-[#F8F9FA]">
                    {toastMessage && (
                        <div className="fixed top-5 right-5 z-50 bg-slate-900 text-white px-4 py-2.5 rounded-2xl shadow-float text-xs font-semibold animate-bounce flex items-center gap-2">
                            <span>✨</span>
                            <span>{toastMessage}</span>
                        </div>
                    )}

                    {/* Sidebar Navigation */}
                    <aside className="w-full md:w-64 bg-white border-r border-slate-200/80 p-5 flex flex-col justify-between shrink-0">
                        <div className="space-y-6">
                            <div className="flex items-center justify-between">
                                <div className="flex items-center gap-3">
                                    <div className="w-10 h-10 rounded-2xl bg-steel-blue text-white flex items-center justify-center shadow-md font-bold text-lg">
                                        日
                                    </div>
                                    <div>
                                        <h1 className="font-extrabold text-base tracking-tight text-slate-800">日本旅遊規劃</h1>
                                        <p className="text-[10px] text-slate-400 font-medium">Japan Travel Planner</p>
                                    </div>
                                </div>
                            </div>

                            {/* Passcode Cloud Status Header */}
                            <div className="bg-slate-50 border border-slate-200 rounded-2xl p-2.5 space-y-1.5">
                                <div className="flex items-center justify-between">
                                    <span className="text-[10px] font-bold text-slate-400">通行密碼</span>
                                    <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${syncStatus === 'synced' ? 'bg-emerald-100 text-emerald-700' : syncStatus === 'error' ? 'bg-amber-100 text-amber-800' : 'bg-blue-100 text-blue-700'}`}>
                                        {syncStatus === 'synced' ? '🟢 雲端同步中' : syncStatus === 'error' ? '🟠 本地儲存模式' : '🟡 連線中...'}
                                    </span>
                                </div>
                                <div className="flex items-center justify-between bg-white px-2.5 py-1.5 rounded-xl border border-slate-200 text-xs font-extrabold text-slate-800">
                                    <span>🔑 {authenticatedCode.toUpperCase()}</span>
                                    <span className="text-[10px] text-steel-blue font-bold">已解鎖</span>
                                </div>
                                <button 
                                    onClick={handleLogout}
                                    className="text-[11px] font-bold text-red-500 hover:underline block pt-0.5"
                                >
                                    🔒 鎖定 / 切換密碼 ➔
                                </button>
                            </div>

                            {currentTrip && (
                                <div className="bg-slate-50 border border-slate-200 rounded-2xl p-2.5">
                                    <label className="block text-[10px] font-bold text-slate-400 mb-1 px-1">選擇旅程</label>
                                    <select 
                                        value={currentTrip.id} 
                                        onChange={(e) => setSelectedTripId(e.target.value)}
                                        className="w-full bg-transparent font-bold text-xs text-slate-800 focus:outline-none cursor-pointer"
                                    >
                                        {trips.map(t => (
                                            <option key={t.id} value={t.id}>{t.title}</option>
                                        ))}
                                    </select>
                                </div>
                            )}

                            <nav className="space-y-1.5">
                                <button 
                                    onClick={() => setActiveTab("dashboard")}
                                    className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all ${activeTab === 'dashboard' ? 'bg-steel-blue text-white shadow-xs' : 'text-slate-600 hover:bg-slate-100'}`}
                                >
                                    <i data-lucide="layout-dashboard" className="w-4 h-4"></i>
                                    <span>儀表板首頁</span>
                                </button>

                                <button 
                                    onClick={() => setActiveTab("itinerary")}
                                    className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all ${activeTab === 'itinerary' ? 'bg-steel-blue text-white shadow-xs' : 'text-slate-600 hover:bg-slate-100'}`}
                                >
                                    <i data-lucide="map-pin" className="w-4 h-4"></i>
                                    <span>每日行程規劃</span>
                                </button>

                                <button 
                                    onClick={() => setActiveTab("bookings")}
                                    className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all ${activeTab === 'bookings' ? 'bg-steel-blue text-white shadow-xs' : 'text-slate-600 hover:bg-slate-100'}`}
                                >
                                    <i data-lucide="bookmark-check" className="w-4 h-4"></i>
                                    <span>預訂與預約紀錄</span>
                                </button>

                                <button 
                                    onClick={() => setActiveTab("budget")}
                                    className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all ${activeTab === 'budget' ? 'bg-steel-blue text-white shadow-xs' : 'text-slate-600 hover:bg-slate-100'}`}
                                >
                                    <i data-lucide="wallet" className="w-4 h-4"></i>
                                    <span>預算追蹤</span>
                                </button>

                                <button 
                                    onClick={() => setActiveTab("group-expenses")}
                                    className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all ${activeTab === 'group-expenses' ? 'bg-steel-blue text-white shadow-xs' : 'text-slate-600 hover:bg-slate-100'}`}
                                >
                                    <i data-lucide="receipt" className="w-4 h-4"></i>
                                    <span>同行分帳記帳</span>
                                </button>

                                <button 
                                    onClick={() => setActiveTab("toolbox")}
                                    className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all ${activeTab === 'toolbox' ? 'bg-steel-blue text-white shadow-xs' : 'text-slate-600 hover:bg-slate-100'}`}
                                >
                                    <i data-lucide="shopping-bag" className="w-4 h-4"></i>
                                    <span>購物To-Buy清單 & 匯率</span>
                                </button>
                            </nav>
                        </div>

                        <div className="bg-pattern p-3.5 rounded-2xl border border-teal-200 mt-6 text-center">
                            <span className="text-xl">🧳</span>
                            <p className="text-xs font-bold text-slate-700 mt-1">旅行行程規劃 App</p>
                            <p className="text-[10px] text-slate-500">雲端同步 • 預訂 • 行程 • 分帳</p>
                        </div>
                    </aside>

                    {/* Main Content Area */}
                    <main className="flex-1 p-4 md:p-8 max-w-7xl mx-auto w-full">
                        {activeTab === "dashboard" && (
                            <DashboardView 
                                trips={trips}
                                onSelectTrip={(t) => {
                                    setSelectedTripId(t.id);
                                    setActiveTab("itinerary");
                                }}
                                onCreateTrip={handleCreateTrip}
                                onDeleteTrip={handleDeleteTrip}
                            />
                        )}

                        {activeTab === "itinerary" && (
                            <TripDetailView 
                                trip={currentTrip}
                                onUpdateItinerary={handleUpdateItinerary}
                                showToast={showToast}
                            />
                        )}

                        {activeTab === "bookings" && (
                            <BookingsView 
                                trip={currentTrip}
                                onUpdateBookings={handleUpdateBookings}
                                showToast={showToast}
                            />
                        )}

                        {activeTab === "budget" && (
                            <BudgetView 
                                trip={currentTrip}
                                onUpdateBudget={handleUpdateBudget}
                            />
                        )}

                        {activeTab === "group-expenses" && (
                            <GroupExpensesView 
                                trip={currentTrip}
                                onUpdateGroupExpenses={handleUpdateGroupExpenses}
                                onUpdateMembers={handleUpdateMembers}
                                showToast={showToast}
                            />
                        )}

                        {activeTab === "toolbox" && (
                            <ToolboxView 
                                trip={currentTrip}
                                onUpdateToBuyList={handleUpdateToBuyList}
                                showToast={showToast}
                            />
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
